function b(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function keyFrom(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k,256)}
async function show(raw){var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c)));document.open();document.write(t);document.close()}
(async function(){var saved=null;try{saved=localStorage.getItem('s2-studio-key')}catch(x){}
if(saved){try{await show(b(saved));return}catch(x){}}
var f=document.getElementById('f');f.hidden=false;f.onsubmit=async function(ev){ev.preventDefault();try{var raw=await keyFrom(document.getElementById('p').value);await show(raw);try{localStorage.setItem('s2-studio-key',b64(raw))}catch(x){}}catch(x){var e=document.getElementById('e');e.textContent='비밀번호가 맞지 않아요.';e.setAttribute('data-err',x.name+': '+x.message)}}})();
